<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackout - DMXtoBeamer</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="top-bar">
        <h1 class="brand">Blackout</h1>
    </header>
    <nav class="client-bar">
        <div class="items" id="client-items">
            <!-- Client items are dynamically loaded here -->
        </div>
    </nav>
    <main class="blackout-content">
        <p class="hint">Select the clients you want to dim, then use one of the buttons below.</p>
        <div class="button-container">
            <button class="hold-button">Hold Dim</button>
            <button class="toggle-button">Toggle Dim</button>
        </div>
    </main>
    <script src="js/blackout.js" type="module"></script>
</body>

</html>
