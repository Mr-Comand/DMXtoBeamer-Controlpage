<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlpage - DMXtoBeamer</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="top-bar">
        <h1 class="brand">DMXtoBeamer</h1>
        <div class="controls">
            <label class="switch" title="Send changes to the client as soon as they are made">
                <input type="checkbox" id="live-update-toggle" checked>
                <span class="slider round"></span>
            </label>
            <span>Live Update</span>

            <button id="pull-data">Pull Data</button>
            <button id="push-data">Push Data</button>
        </div>
    </header>
    <nav class="client-bar">
        <div class="items" id="client-items">
            <!-- Client items are dynamically loaded here -->
        </div>
    </nav>
    <main class="content">
        <!-- Layers will be dynamically loaded here -->
    </main>
    <section class="add-layer-container">
        <h3>Add new layer:</h3>
        <div class="add-layer-row">
            <select id="animation-select" name="animationID">
                <!-- Animation options will be dynamically loaded here -->
            </select>
            <button id="send-button">Add</button>
        </div>
    </section>
    <div id="popup" class="popup">
        <div class="popup-content">
            <span class="close" onclick="closePopup()">&times;</span>
            <h2>Settings</h2>
            <div id="settings-form">
                <!-- Form elements will be dynamically loaded here -->
            </div>
        </div>
        <div class="popup-content shader">
            <span class="close" onclick="closeShaderPopup()">&times;</span>
            <h2>Settings</h2>
            <div id="shader-settings-form">
                <!-- Shader settings will be dynamically loaded here -->
            </div>
        </div>
    </div>
    <script src="js/script.js" type="module"></script>
</body>

</html>
